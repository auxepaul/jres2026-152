## global section

include /etc/openldap/schema/core.schema
include /etc/openldap/schema/cosine.schema
include /etc/openldap/schema/inetorgperson.schema
include /etc/openldap/schema/openldap.schema
include /etc/openldap/schema/dyngroup.schema
include /etc/openldap/schema/eduperson.schema
include /etc/openldap/schema/passwordSelfReset.schema
include /etc/openldap/schema/schac.schema
include /etc/openldap/schema/supann.schema

sizelimit 5000

pidfile     /var/run/openldap/slapd.pid
argsfile    /var/run/openldap/slapd.args

modulepath  /usr/lib64/openldap
moduleload  dyngroup.la

TLSCipherSuite          HIGH:!MD5:!RC4:!aNULL
TLSCertificateFile      /etc/pki/tls/certs/ldap.formation.lab.pem
TLSCertificateKeyFile   /etc/pki/tls/private/ldap.formation.lab.pem
TLSCACertificateFile    /etc/pki/tls/certs/formation.lab_CA.pem

loglevel stats

## main database

database mdb
suffix dc=formation,dc=lab
directory /var/lib/ldap

rootdn cn=admin,dc=formation,dc=lab
rootpw VeryStrongLdapPassword

index objectclass,mail,uid eq

access to attrs=userPassword
    by self read
    by anonymous auth
    by * none

access to *
    by * read
