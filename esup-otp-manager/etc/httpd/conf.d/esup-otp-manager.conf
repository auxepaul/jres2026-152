<VirtualHost *:80>
    ServerName esup-otp-manager.formation.lab

    CustomLog "logs/esup-otp-manager.formation.lab.access.log" combined env=!nolog
    ErrorLog "logs/esup-otp-manager.formation.lab.error.log"

    RedirectMatch ^(.*)$ https://esup-otp-manager.formation.lab$1
</VirtualHost>

<VirtualHost *:443>
    ServerName esup-otp-manager.formation.lab

    CustomLog "logs/esup-otp-manager.formation.lab.access.log" combined env=!nolog
    ErrorLog "logs/esup-otp-manager.formation.lab.error.log"

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/esup-otp-manager.formation.lab.pem
    SSLCertificateKeyFile /etc/pki/tls/private/esup-otp-manager.formation.lab.pem
    SSLCertificateChainFile /etc/pki/tls/certs/formation.lab_CA.pem

    RequestHeader set X-Forwarded-Proto https
    RequestHeader set X-Forwarded-Port 443

    RewriteEngine On

    RewriteCond %{QUERY_STRING} transport=websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:4000/$1 [P]

    ProxyPass / http://127.0.0.1:4000/ retry=1
    ProxyPassReverse / http://127.0.0.1:4000/
</VirtualHost>
