<VirtualHost *:80>
    ServerName sp.formation.lab

    CustomLog "logs/sp.formation.lab.access.log" combined env=!nolog
    ErrorLog "logs/sp.formation.lab.error.log"

    RedirectMatch ^(.*)$ https://sp.formation.lab$1
</VirtualHost>

<VirtualHost *:443>
    ServerName sp.formation.lab

    CustomLog "logs/sp.formation.lab.access.log" combined env=!nolog
    ErrorLog "logs/sp.formation.lab.error.log"

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/sp.formation.lab.pem
    SSLCertificateKeyFile /etc/pki/tls/private/sp.formation.lab.pem
    SSLCertificateChainFile /etc/pki/tls/certs/formation.lab_CA.pem

    DocumentRoot /usr/local/share/test-sp/www
    <Directory /usr/local/share/test-sp/www>
	AuthType shibboleth
	Require shibboleth
	ShibRequestSetting requireSession Off
    </Directory>

    Alias /Shibboleth /usr/share/shibboleth
    <Directory /usr/share/shibboleth>
	AuthType none
	Require all granted
    </Directory>

    <Location /Shibboleth.sso>
	AuthType none
	Require all granted
	SetHandler shib
    </Location>

</VirtualHost>
