cas.server.name=https://cas.formation.lab
cas.server.prefix=${cas.server.name}/cas

server.port=443
server.ssl.enabled=true
server.ssl.key-store=file:/etc/cas/config/keystore.jks
server.ssl.key-store-password=changeit

# Localization
cas.locale.defaultValue=fr

# Logging
logging.config=file:/etc/cas/config/log4j2.xml

# JSON Service registry
# https://apereo.github.io/cas/8.0.x/services/JSON-Service-Management.html
cas.service-registry.core.init-from-json=false
cas.service-registry.json.location=file:/etc/cas/services

# Whether v2 protocol support should be forward compatible to act like v3 and match its response, mainly for attribute release
cas.view.cas2.v3-forward-compatible=false

# Authentication
# Accept Users Authentication (DON'T USE IN PRODUCTION)
#cas.authn.accept.enabled=true
cas.authn.accept.enabled=false
#cas.authn.accept.users=etudiant1::etudiant1,etudiant2::etudiant2,lecteur1::lecteur1,enseignant1::enseignant1,personnel1::personnel1

# LDAP Authentication
# https://apereo.github.io/cas/8.0.x/authentication/LDAP-Authentication.html
cas.authn.ldap[0].base-dn= ou=people,dc=formation,dc=lab
cas.authn.ldap[0].bind-credential= read
cas.authn.ldap[0].bind-dn= cn=read,dc=formation,dc=lab
cas.authn.ldap[0].ldap-url= ldaps://ldap.formation.lab
cas.authn.ldap[0].search-filter= uid={user}
# AD: Active Directory, AUTHENTICATED: Authenticated Search, DIRECT: Direct Bind, ANONYMOUS: Anonymous Search
cas.authn.ldap[0].type= AUTHENTICATED
cas.authn.ldap[0].trust-certificates=file:/etc/pki/tls/certs/formation.lab_CA.pem

## Attributs à exposer par défaut en CASv3, SAMLv1, IdP..
# https://apereo.github.io/cas/8.0.x/integration/Attribute-Release-Policy-DefaultBundle.html
# Cette ligne affichera l'ensemble des attributs pour tous les modules disponibles
cas.authn.attribute-repository.core.default-attributes-to-release= supannAliasLogin,uid,cn,givenName,displayname,mail,eduPersonAffiliation,supannRefId,authnContextClass
## Protocol Attributes (SAML1, RememberMe...)
cas.authn.authentication-attribute-release.enabled=false

# LDAP Attribute Resolution
# https://apereo.github.io/cas/8.0.x/integration/Attribute-Resolution-LDAP.html
cas.authn.attribute-repository.ldap[0].base-dn= ou=people,dc=formation,dc=lab
cas.authn.attribute-repository.ldap[0].bind-credential= read
cas.authn.attribute-repository.ldap[0].bind-dn= cn=read,dc=formation,dc=lab
cas.authn.attribute-repository.ldap[0].ldap-url= ldaps://ldap.formation.lab
cas.authn.attribute-repository.ldap[0].search-filter= uid={user}
#cas.authn.attribute-repository.ldap[0].attributes=
#cas.authn.attribute-repository.ldap[0].id=
cas.authn.attribute-repository.ldap[0].trust-certificates=file:/etc/pki/tls/certs/formation.lab_CA.pem

# Management
# ANONYMOUS access for all endpoints * (DON'T USE IN PRODUCTION)
management.endpoints.access.default=unrestricted
management.endpoints.web.exposure.include=*
cas.monitor.endpoints.endpoint.defaults.access=ANONYMOUS
# Turning off composite discovery client indicator which doesn't work with default CAS
spring.cloud.discovery.client.composite-indicator.enabled=false

# No http and view cache for development
spring.thymeleaf.cache=false
cas.http-web-request.header.cache=false
#cas.http-web-request.cors.enabled=false

# Shibboleth Integration - Tutoriel Chapitre 7
# SSO for Shibboleth IdP (External)
# https://apereo.github.io/cas/8.0.x/integration/Shibboleth.html
#cas.authn.shib-idp.server-url=idp-stagiaire.formation.lab

# Multifactor Authentication (MFA) - Tutoriel Chapitre 8 
# https://apereo.github.io/cas/8.0.x/mfa/Configuring-Multifactor-Authentication.html

# Activate MFA globally for all, regardless of other settings
# https://apereo.github.io/cas/8.0.x/mfa/Configuring-Multifactor-Authentication-Triggers-Global.html
# MFA avec Esup-OTP
#cas.authn.mfa.triggers.global.global-provider-id=mfa-esupotp

# Esup-OTP
# @see https://github.com/EsupPortail/esup-otp-cas
# Add translations, you will need to check what are the default from CAS "Message Bundles" properties
cas.messageBundle.baseNames=classpath:custom_messages,classpath:messages,classpath:esupotp_message
# Add your esup-otp-api in Content-Security-Policy:
cas.http-web-request.header.content-security-policy=script-src 'self' 'unsafe-inline' 'unsafe-eval' https://esup-otp-api.formation.lab/; object-src 'none'; worker-src 'self' blob: 'unsafe-inline' 

# SAML2 Authentication (IdP on CAS server) - Tutoriel Chapitre X
# https://apereo.github.io/cas/8.0.x/authentication/Configuring-SAML2-Authentication.html
#cas.server.scope=formation.lab
# See metadata https://cas.formation.lab/cas/idp/metadata
#cas.authn.saml-idp.core.entity-id=${cas.server.prefix}/idp
#cas.authn.saml-idp.metadata.file-system.location=file:/etc/cas/saml
